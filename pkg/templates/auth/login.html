<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login- CarePoint</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50 text-gray-800">

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">
            <div class="text-center text-blue-600 font-bold text-xl mb-2">CarePoint</div>
            <h2 class="text-2xl font-bold text-center mb-6">Login</h2>
            <form class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-500">
                </div>


                <div>
                    <label for="Password" class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring focus:ring-blue-500">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Login</button>
                
            </form>
            <p class="text-sm text-center mt-4 text-gray-600">Don't have an account?
                <a href="care_reg.html" class="text-blue-600 hover:underline">Register</a>
            </p>

            <div class="text-center">
                <a href="care_reg.html" class="text-sm text-blue-600 hover:underline">Forgot Password?</a>
            </div>
        </div>
    </div>
    
    
</body>
</html>
