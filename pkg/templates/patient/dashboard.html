<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CarePoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex min-h-screen">
        <aside class="w-64 bg-white shadow-md">
            <div class="p-6 text-xl font-bold text-blue-600 border-b">CarePoint</div>
            <nav class="p-4 space-y-2">
                <a href="#" class="block px-4 py-2 rounded-md bg-blue-50 text-blue-600 font-medium">Dashboard</a>
                <a href="#" class="block px-4 py-2 rounded-md bg-blue-50 text-gray-600 hover:bg-gray-100">Appointment</a>
                <a href="#" class="block px-4 py-2 rounded-md bg-blue-50 text-gray-600 hover:bg-gray-100">Profile</a>
                <a href="#" class="block px-4 py-2 rounded-md bg-blue-50 text-gray-600 hover:bg-gray-100">LogOut</a>
            </nav>
        </aside>
        <main class="flex-1 p-6">
            <div class="mb-6">
  <h1 class="text-2xl font-bold">Welcome back, [User]</h1>
  <p class="text-gray-600">Here's what's happening with your appointments.</p>
</div>

<div class="grid grid-cols-1 md:grid-cols-3 gap-4">

  <div class="bg-white rounded-lg shadow-sm p-6">
    <p class="text-sm text-gray-500">Upcoming Appointments</p>
    <p class="text-3xl font-bold mt-2">3</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm p-6">
    <p class="text-sm text-gray-500">Completed Appointments</p>
    <p class="text-3xl font-bold mt-2">12</p>
  </div>

  <div class="bg-white rounded-lg shadow-sm p-6">
    <p class="text-sm text-gray-500">Documents</p>
    <p class="text-3xl font-bold mt-2">5</p>
  </div>

</div>
        </main>
    </div>
    
</body>
</html>
