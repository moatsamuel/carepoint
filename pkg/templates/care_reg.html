<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CarePoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">
            <div class="text-center text-blue-600 font-bold text-xl mb-2">CarePoint</div>
        <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>

        <form class="space-y-4">
            <div>
                <label for="fullname" class="block text-sm font-medium mb-1">FullName</label>
                <input type="text" id="fullname" name="fullname" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium mb-1">Email</label>
                <input type="text" id="email" name="email" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-medium mb-1">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium mb-1">Phone Number</label>
                <input type="tel" id="phone" name="phone" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="dob" class="block text-sm font-medium mb-1">Date of Birth</label>
                <input type="date" id="dob" name="dob" class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700">Register</button>

            <p class="text-sm text-center mt-4 text-gray-600">
                Already have an account?
                <a href="care_page.html" class="text-blue-600 hover:underline">Login</a>
            </p>

            
        </form>

        </div>
        
    </div>

    
</body>
</html>
